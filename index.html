            font-family: 'Times New Roman', Times, serif;

        }

        .panels {

            min-height: 85vh;
            display: flex;
            gap: 10px;
        }

        .panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 1px 1px 5px white;
            transition: flex 0.5s ease-in;
            text-transform: uppercase;
        }

        .panel.open {
            flex: 5;
            font-size: 2rem;
            font-weight: 800;
        }

        .poz {
            display:flex;
        }

        h1 {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            letter-spacing: 10px;
            font-weight: 900;
            font-size: 35px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            text-align: center;
        }

        .panel::after {
            content: "";
            position: relative;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
        }

        #fejlec {
            display: flex;
            min-height: 4vh;

            font-size: 20px;

            text-decoration: none;

        @media screen and (max-width: 600px) {
            .Future {

    <script>

        const adatok = [
            {word: "Oldtimer", photo: "old.png"},
            {word: "Modern", photo: "new.jpg"},
            {word: "Future", photo: "taycan.jpg"},
            {word: "Racing", photo: "963.jpg"}
        ];
        adatok.forEach((obj)=>document.querySelector(".panels").innerHTML+=`
        <div class="panel ${obj.word}">${obj.word}</div>
        `)

        const panelList=document.querySelectorAll(".panel")//interáló, 
        panelList.forEach((panel, index)=>panel.style.backgroundImage=`url(${adatok[index].photo})`)

        const toggleOpen=(e)=>{
            console.log(e.target);
            if (e.target.classList.contains('open')) 
                e.target.classList.remove('open')
            else {
                panelList.forEach(panel=>panel.classList.remove('open'))
                e.target.classList.add('open')
            }

        }
